name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, zip, gd, intl, soap, curl, xml, dom
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Static analysis (PHPStan)
        # moodle-plugin-ci has no built-in PHPStan command, so it is installed and run directly.
        # Runs against every matrix leg on purpose (unlike Grunt): the same code is analysed
        # against each Moodle version's real classes, which can catch calls to functions that were
        # removed or renamed in a specific Moodle version (phpcs/phpunit alone would not).
        if: ${{ !cancelled() }}
        working-directory: plugin
        # Advisory only: phpstan-moodle's Moodle-wide class scanning reports false "return statement
        # is missing" errors that cannot be suppressed reliably (see .github/phpstan.neon). PHPStan is
        # not required for the plugin directory; phpcs, PHPUnit, Behat and Grunt still gate the build.
        continue-on-error: true
        # phpstan/extension-installer is deliberately not used: it is a Composer plugin, blocked
        # by Composer's allow-plugins policy unless explicitly trusted, and unnecessary anyway
        # since .github/phpstan.neon includes the moodle extension directly.
        run: |
          composer require --dev --no-interaction --quiet "phpstan/phpstan:2.1.*" micaherne/phpstan-moodle
          vendor/bin/phpstan analyse --configuration=.github/phpstan.neon --no-progress

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt (JS lint and check that the AMD build is up to date)
        # Deliberately runs on one leg only: moodle-plugin-ci's grunt command both lints our JS/CSS
        # and diffs the built output against git, using the node_modules bundled with that specific
        # Moodle checkout. Different Moodle branches can bundle different eslint/stylelint/terser
        # versions, which can make the committed build look "out of date" or produce different lint
        # warnings for identical source - not a real code problem, just toolchain drift. Running on
        # every leg would trade a small coverage gain for a real risk of spurious failures.
        if: ${{ !cancelled() && matrix.moodle-branch == 'MOODLE_500_STABLE' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Check language strings
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: bash .github/scripts/check-lang-strings.sh

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat faildump
        if: ${{ always() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
