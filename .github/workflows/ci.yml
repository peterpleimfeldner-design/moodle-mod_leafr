name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

jobs:
  package:
    # Builds the plugin ZIP with git archive (exactly like a release) and checks the finished ZIP:
    # LICENSE, required files, thirdpartylibs.xml locations, nothing internal. On HEAD there is
    # no release tag, so the version/maturity check is skipped; run the script on the tag
    # before every upload (see .github/scripts/build-release-zip.sh). Also checks the bundled
    # PDF.js: consistent versions and checksums, and unchanged text extraction from the test PDFs.
    name: Package check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the script can resolve any ref it is given.
          fetch-depth: 0

      - name: Build and check the plugin ZIP
        run: bash .github/scripts/build-release-zip.sh HEAD "$RUNNER_TEMP/mod_leafr_ci.zip"

      - name: Check the bundled PDF.js (versions, checksums, no old module name)
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-pdfjs.sh

      - name: Set up Node.js for the PDF.js reference check
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          # PDF.js 6.4 supports Node.js 22 and later.
          node-version: '22'

      - name: Compare PDF.js text, outline and page sizes with the stored reference
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-pdfjs-reference.sh

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Moodle 5.3 requires PostgreSQL 17; older branches accept it as well.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        # Moodle 5.3 requires MySQL 8.4. Only the matrix legs with database 'mysqli' use it.
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        # Moodle 5.3 requires MariaDB 11.4. On port 3307, as port 3306 belongs to MySQL above.
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'mysqli'
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mysqli'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mariadb'
            db-port: '3307'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, zip, gd, intl, soap, curl, xml, dom
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 ${{ matrix.db-port && format('--db-port={0}', matrix.db-port) || '' }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Static analysis (PHPStan)
        # moodle-plugin-ci has no built-in PHPStan command, so it is installed and run directly.
        # Runs against every matrix leg on purpose (unlike Grunt): the same code is analysed
        # against each Moodle version's real classes, which can catch calls to functions that were
        # removed or renamed in a specific Moodle version (phpcs/phpunit alone would not).
        if: ${{ !cancelled() }}
        working-directory: plugin
        # Advisory only: phpstan-moodle's Moodle-wide class scanning reports false "return statement
        # is missing" errors that cannot be suppressed reliably (see .github/phpstan.neon). PHPStan is
        # not required for the plugin directory; phpcs, PHPUnit, Behat and Grunt still gate the build.
        continue-on-error: true
        # phpstan/extension-installer is deliberately not used: it is a Composer plugin, blocked
        # by Composer's allow-plugins policy unless explicitly trusted, and unnecessary anyway
        # since .github/phpstan.neon includes the moodle extension directly.
        run: |
          composer require --dev --no-interaction --quiet "phpstan/phpstan:2.1.*" micaherne/phpstan-moodle
          vendor/bin/phpstan analyse --configuration=.github/phpstan.neon --no-progress

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt (JS lint and check that the AMD build is up to date)
        # Deliberately runs on one leg only: moodle-plugin-ci's grunt command both lints our JS/CSS
        # and diffs the built output against git, using the node_modules bundled with that specific
        # Moodle checkout. Different Moodle branches can bundle different eslint/stylelint/terser
        # versions, which can make the committed build look "out of date" or produce different lint
        # warnings for identical source - not a real code problem, just toolchain drift. Running on
        # every leg would trade a small coverage gain for a real risk of spurious failures.
        if: ${{ !cancelled() && matrix.moodle-branch == 'MOODLE_500_STABLE' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Check language strings
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: bash .github/scripts/check-lang-strings.sh

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: PHPUnit tests of the leafrtool subplugins
        # moodle-plugin-ci only runs the tests of mod_leafr itself (tests/), not those of the
        # subplugins in tool/*/tests, which Moodle registers as test suites of their own.
        if: ${{ !cancelled() }}
        working-directory: moodle
        run: |
          vendor/bin/phpunit --fail-on-warning --testsuite leafrtool_confirm_testsuite
          vendor/bin/phpunit --fail-on-warning --testsuite leafrtool_report_testsuite

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        # Scenarios tagged @leafr_themecheck need a theme that is only installed in the job "Theme check".
        run: moodle-plugin-ci behat --profile chrome --tags="@mod_leafr&&~@leafr_themecheck"

      - name: Upload Behat faildump
        if: ${{ always() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  themes:
    # Runs the full screen scenarios with Boost Union, one of the most used themes (GitHub issue #16:
    # with Moodle 5.3 and Boost Union, toolbar and menu reacted hardly at all in full screen mode).
    # The reader covers the page in full screen mode, so a theme's layers and scripts can get in the way.
    name: Theme check (Boost Union, ${{ matrix.moodle-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, zip, gd, intl, soap, curl, xml, dom
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Add Boost Union
        # The theme's branches are named like Moodle's.
        run: moodle-plugin-ci add-plugin --branch ${{ matrix.moodle-branch }} moodle-an-hochschulen/moodle-theme_boost_union

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Behat with Boost Union
        id: behat
        run: moodle-plugin-ci behat --profile chrome --tags="@leafr_themecheck"

      - name: Upload Behat faildump
        if: ${{ always() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-boostunion-${{ matrix.moodle-branch }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  upgrade:
    # Installs the previous release, creates data with it, upgrades to this commit and checks that
    # no data was lost or changed (see .github/scripts/upgrade-check/README.md).
    name: Upgrade check (${{ matrix.moodle-branch }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIOUS_RELEASE: v1.3.0

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mysqli'

    steps:
      - name: Check out this commit
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Check out the previous release
        run: git -C plugin worktree add "$GITHUB_WORKSPACE/plugin-previous" "$PREVIOUS_RELEASE"

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, zip, gd, intl, soap, curl, xml, dom
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install Moodle with the previous release
        run: moodle-plugin-ci install --plugin ./plugin-previous --db-host=127.0.0.1 --no-init
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Install the Moodle site
        # moodle-plugin-ci only prepares the PHPUnit and Behat test sites; the upgrade needs a real site.
        # The command line scripts stay in moodle/admin/cli also since Moodle 5.1 (public/ layout).
        run: >-
          php moodle/admin/cli/install_database.php --agree-license --fullname="Upgrade check"
          --shortname=upgrade --adminpass="$(openssl rand -hex 16)Aa1!" --adminemail=admin@example.com

      - name: Create data with the previous release and take a snapshot
        run: |
          php plugin/.github/scripts/upgrade-check/seed.php moodle/config.php
          php plugin/.github/scripts/upgrade-check/snapshot.php moodle/config.php "$GITHUB_WORKSPACE/before.json"

      - name: Upgrade to this commit
        run: |
          # Since Moodle 5.1 the code lives in moodle/public, so the paths come from $CFG->dirroot.
          dirroot=$(php -r "define('CLI_SCRIPT', true); require('moodle/config.php'); echo \$CFG->dirroot;")
          rm -rf "$dirroot/mod/leafr"
          mkdir -p "$dirroot/mod/leafr"
          git -C plugin archive HEAD | tar -x -C "$dirroot/mod/leafr"
          php moodle/admin/cli/upgrade.php --non-interactive

      - name: Compare the data before and after the upgrade
        run: |
          php plugin/.github/scripts/upgrade-check/snapshot.php moodle/config.php "$GITHUB_WORKSPACE/after.json"
          php plugin/.github/scripts/upgrade-check/compare.php "$GITHUB_WORKSPACE/before.json" "$GITHUB_WORKSPACE/after.json"
